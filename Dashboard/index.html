<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindMesh Dashboard</title>
<style>
:root{--bg:#0b0d12;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);
--fg:#e6edf3;--dim:#8b98a5;--dim2:#5c6773;--acc:#5b9dff;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;background:
 radial-gradient(1100px 520px at 12% -10%,rgba(91,157,255,.10),transparent 60%),var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 70px}
h1{margin:0;font-size:22px;letter-spacing:.4px}
h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:12.5px;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:100px}
.stat .k{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.7px}
.stat .v{font-size:16px;font-weight:600;margin-top:3px}
h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim2);
margin:30px 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card .name{font-weight:600;font-size:15px}
.card .meta{color:var(--dim);font-size:12px;margin-top:7px;line-height:1.7}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
li{list-style:none}
ul{margin:0;padding:0}
.cm{display:flex;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;align-items:baseline}
.cm:hover{background:var(--card)}
.cm .sha{color:var(--dim2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.cm .date{color:var(--dim2);font-size:12px;min-width:80px}
.cm .agent{color:var(--acc);font-weight:600;font-size:12.5px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;
font-size:11px;color:var(--dim)}
.tag.pub{color:var(--ok);border-color:rgba(63,185,80,.4)}
.tag.priv{color:var(--warn);border-color:rgba(210,153,34,.4)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
input,button{font:inherit}
input[type=text],input[type=password]{background:rgba(255,255,255,.05);border:1px solid var(--line);
border-radius:9px;padding:8px 11px;color:var(--fg);outline:none;font-size:13px}
input:focus{border-color:rgba(91,157,255,.7)}
button{background:rgba(91,157,255,.16);border:1px solid rgba(91,157,255,.5);color:#cfe1ff;
border-radius:9px;padding:8px 14px;cursor:pointer;font-size:13px}
button:hover{background:rgba(91,157,255,.24)}
.tree{max-height:420px;overflow:auto;font-size:12.5px;margin-top:10px}
.tree .f{display:flex;gap:9px;align-items:center;padding:4px 8px;border-radius:7px;cursor:pointer}
.tree .f:hover{background:rgba(255,255,255,.05)}
.tree .p{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
pre{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;
padding:13px;overflow:auto;max-height:520px;font-size:12.5px;line-height:1.6}
.muted{color:var(--dim2);font-size:12.5px}
.err{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1>MindMesh <span>Dashboard</span></h1>
  <div class="sub" id="repo">加载中…</div>
  <div class="row" id="stats"></div>

  <div class="panel" id="auth" style="display:none">
    <div class="muted">仓库的私有区域需要口令。口令摘要存在 <code>Dashboard/secret/</code>，明文不入库。</div>
    <div class="row" style="margin-bottom:0">
      <input type="password" id="pw" placeholder="访问口令" style="flex:1 1 200px">
      <button onclick="login()">登录</button>
      <button onclick="logout()" style="background:var(--card);border-color:var(--line);color:var(--dim)">登出</button>
    </div>
  </div>

  <h2>Agents</h2>
  <div class="grid" id="agents"></div>

  <h2>近期提交</h2>
  <div id="commits"><div class="muted">加载中…</div></div>

  <h2>文件</h2>
  <div class="panel">
    <input type="text" id="filter" placeholder="过滤路径…" oninput="renderTree()" style="width:100%">
    <div class="muted" style="margin-top:8px" id="treeinfo"></div>
    <div class="tree" id="tree"></div>
  </div>

  <div class="panel" id="viewer" style="display:none">
    <div class="row" style="margin-top:0">
      <strong id="vpath" style="font-size:13px;font-weight:600"></strong>
      <span style="flex:1"></span>
      <button onclick="closeViewer()" style="background:var(--card);border-color:var(--line);color:var(--dim)">关闭</button>
    </div>
    <pre id="vtext"></pre>
  </div>

  <div class="muted" style="margin-top:26px">
    只读看板 · 不写入仓库 · 数据来自 <code>git ls-tree / git log / git cat-file</code>
  </div>
</div>

<script>
var TREE = [];
var ME = {authed:false, authRequired:false};

function fmtBytes(n){
  if(n==null) return "—";
  if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(1)+" KB";
  return (n/1048576).toFixed(1)+" MB";
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function api(path, opts){
  return fetch(path, opts).then(function(r){
    return r.json().then(function(j){
      if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
      return j;
    });
  });
}

function load(){
  api("/api/me").then(function(m){
    ME = m;
    document.getElementById("auth").style.display = (m.authRequired && !m.authed) ? "block" : "none";
  }).catch(function(){});

  api("/api/summary").then(function(s){
    document.getElementById("repo").textContent =
      s.root + " · " + s.branch + " @ " + s.head + " · " + s.fileCount + " 个受管文件 · " + fmtBytes(s.totalBytes);
    var st = [["Agents", s.agents.length], ["提交(近200)", s.recentCommits.length],
              ["文件", s.fileCount], ["体积", fmtBytes(s.totalBytes)]];
    document.getElementById("stats").innerHTML = st.map(function(x){
      return '<div class="stat"><div class="k">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+'</div></div>';
    }).join("");

    var maxb = 1;
    s.agents.forEach(function(a){ if(a.bytes>maxb) maxb=a.bytes; });
    document.getElementById("agents").innerHTML = s.agents.length ? s.agents.map(function(a){
      var pct = Math.round(100*a.bytes/maxb);
      return '<div class="card"><div class="name">'+esc(a.name)+'</div>'+
        '<div class="meta">'+a.files+' 个文件 · '+fmtBytes(a.bytes)+'<br>'+
        a.commits+' 次提交 · 最近 '+(a.last||"—")+'</div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    }).join("") : '<div class="muted">还没有任何 Memory/&lt;Agent&gt;/ 目录</div>';

    document.getElementById("commits").innerHTML = s.recentCommits.length ?
      '<ul>'+s.recentCommits.map(function(c){
        return '<li class="cm"><span class="sha">'+esc(c.sha)+'</span>'+
               '<span class="date">'+esc(c.date)+'</span>'+
               '<span class="agent">'+esc(c.agent||"—")+'</span>'+
               '<span>'+esc(c.subject)+'</span></li>';
      }).join("")+'</ul>' : '<div class="muted">暂无提交</div>';
  }).catch(function(e){
    document.getElementById("repo").innerHTML = '<span class="err">'+esc(e.message)+'</span>';
  });

  api("/api/tree").then(function(t){
    TREE = t.files;
    document.getElementById("treeinfo").textContent =
      t.files.length + " 个文件" + (t.truncated ? "（已截断）" : "");
    renderTree();
  }).catch(function(){});
}

function renderTree(){
  var q = document.getElementById("filter").value.toLowerCase();
  var rows = TREE.filter(function(f){ return f.path.toLowerCase().indexOf(q)>=0; }).slice(0, 400);
  document.getElementById("tree").innerHTML = rows.map(function(f){
    return '<div class="f" onclick="open_(\''+f.path.replace(/'/g,"")+'\')">'+
      '<span class="tag '+(f.public?'pub':'priv')+'">'+(f.public?'公开':'私有')+'</span>'+
      '<span class="p">'+esc(f.path)+'</span>'+
      '<span style="flex:1"></span><span class="muted">'+fmtBytes(f.size)+'</span></div>';
  }).join("") || '<div class="muted">没有匹配的文件</div>';
}

function open_(p){
  api("/api/file?path="+encodeURIComponent(p)).then(function(f){
    document.getElementById("viewer").style.display = "block";
    document.getElementById("vpath").textContent = f.path;
    document.getElementById("vtext").textContent = f.text;
    document.getElementById("viewer").scrollIntoView({behavior:"smooth"});
  }).catch(function(e){ alert(e.message); });
}
function closeViewer(){ document.getElementById("viewer").style.display = "none"; }

function login(){
  var pw = document.getElementById("pw").value;
  api("/api/login", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({password: pw})})
    .then(function(){ location.reload(); })
    .catch(function(e){ alert(e.message); });
}
function logout(){
  api("/api/logout", {method:"POST"}).then(function(){ location.reload(); });
}

load();
</script>
</body>
</html>
